
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTECH SOLUTION Admin</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #eef4ff;
  margin: 0;
  padding: 15px;
  color: #222;
}

header {
  background: #0756b5;
  color: white;
  padding: 20px;
  text-align: center;
  border-radius: 10px;
}

.card {
  background: white;
  padding: 18px;
  margin-top: 18px;
  border-radius: 10px;
  box-shadow: 0 2px 8px #0001;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 6px;
  font-size: 15px;
}

input, select {
  border: 1px solid #ccc;
}

button {
  background: #0756b5;
  color: white;
  border: none;
  cursor: pointer;
}

.delete { background: #d93025; }
.logout { background: #555; }

.stat {
  font-size: 20px;
  font-weight: bold;
  color: #0756b5;
}

.order {
  border: 1px solid #ddd;
  padding: 14px;
  margin: 12px 0;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.order p { margin: 8px 0; }
.hidden { display: none; }

footer {
  text-align: center;
  padding: 20px;
  color: #555;
}
</style>
</head>

<body>

<header>
  <h2>ANTECH SOLUTION</h2>
  <p>Customer Order Management</p>
</header>

<div class="card" id="loginBox">
  <h3>Admin Login</h3>
  <input
    id="password"
    type="password"
    placeholder="Enter Admin Password"
    autocomplete="current-password"
  >
  <button onclick="login()">Login</button>
  <p id="loginMessage"></p>
</div>

<div id="dashboard" class="hidden">

  <div class="card">
    <h3>Admin Dashboard</h3>

    <p>Total Orders: <span class="stat" id="totalOrders">0</span></p>
    <p>Pending Orders: <span class="stat" id="pendingOrders">0</span></p>
    <p>Delivered Orders: <span class="stat" id="deliveredOrders">0</span></p>
    <p>Total Sales: ₹<span class="stat" id="totalSales">0</span></p>

    <button class="logout" onclick="logout()">Logout</button>
    <button onclick="loadOrders()">Refresh Orders</button>
  </div>

  <div class="card">
    <h3>Order List</h3>
    <div id="list">Loading orders...</div>
  </div>

</div>

<footer>
  ANTECH SOLUTION
  <p>Computer & Electronics Spare Parts</p>
</footer>

<script>
let adminPassword = "";
let orders = [];

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "x-admin-password": adminPassword,
      ...(options.headers || {})
    }
  });

  const data = await response.json();

  if (response.status === 401) {
    logout();
    throw new Error("Invalid password. Please login again.");
  }

  if (!response.ok || !data.success) {
    throw new Error(data.message || "Request failed");
  }

  return data;
}

async function login() {
  const password = document.getElementById("password").value;

  if (!password) {
    document.getElementById("loginMessage").textContent =
      "Please enter password";
    return;
  }

  adminPassword = password;

  try {
    const data = await api("/api/orders");

    orders = data.orders || [];

    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("password").value = "";

    showOrders();

  } catch (error) {
    adminPassword = "";
    document.getElementById("loginMessage").textContent =
      error.message;
  }
}

function logout() {
  adminPassword = "";
  orders = [];

  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("password").value = "";
  document.getElementById("loginMessage").textContent =
    "Logged out.";
}

async function loadOrders() {
  try {
    const data = await api("/api/orders");
    orders = data.orders || [];
    showOrders();
  } catch (error) {
    alert(error.message);
  }
}

function showOrders() {
  document.getElementById("totalOrders").textContent =
    orders.length;

  document.getElementById("pendingOrders").textContent =
    orders.filter(o => o.status === "Pending").length;

  document.getElementById("deliveredOrders").textContent =
    orders.filter(o => o.status === "Delivered").length;

  document.getElementById("totalSales").textContent =
    orders.reduce((sum, o) => sum + Number(o.amount || 0), 0);

  const list = document.getElementById("list");
  list.replaceChildren();

  if (orders.length === 0) {
    list.textContent = "No orders available.";
    return;
  }

  orders.forEach(order => {
    const box = document.createElement("div");
    box.className = "order";

    function addText(label, value) {
      const p = document.createElement("p");
      p.textContent = label + ": " + (value ?? "-");
      box.appendChild(p);
    }

    addText("Order ID", order.id);
    addText("Customer", order.customer);
    addText("Phone", order.phone);
    addText("Address", order.address);

    let products = [];

    try {
      products = typeof order.products === "string"
        ? JSON.parse(order.products)
        : (order.products || []);
    } catch {
      products = [];
    }

    const productText = products.map(p =>
      `${p.name} × ${p.quantity} (₹${p.price})`
    ).join(", ");

    addText("Products", productText || "Not available");
    addText("Amount", "₹" + order.amount);
    addText("Date", order.created_at);
    addText("Current Status", order.status);

    if (order.map_link) {
      const map = document.createElement("a");
      map.href = order.map_link;
      map.textContent = "View Customer Location";
      map.target = "_blank";
      map.rel = "noopener noreferrer";
      box.appendChild(map);
    }

    const status = document.createElement("select");

    [
      "Pending",
      "Processing",
      "Shipped",
      "Delivered",
      "Cancelled"
    ].forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      status.appendChild(option);
    });

    status.value = order.status || "Pending";

    status.onchange = () => updateStatus(order.id, status.value);

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete Order";
    deleteButton.className = "delete";
    deleteButton.onclick = () => deleteOrder(order.id);

    box.appendChild(status);
    box.appendChild(deleteButton);

    list.appendChild(box);
  });
}

async function updateStatus(id, status) {
  try {
    await api("/api/orders/" + id, {
      method: "PATCH",
      body: JSON.stringify({ status })
    });

    alert("Order status updated successfully!");
    await loadOrders();

  } catch (error) {
    alert(error.message);
  }
}

async function deleteOrder(id) {
  if (!confirm("Are you sure you want to delete this order?")) {
    return;
  }

  try {
    await api("/api/orders/" + id, {
      method: "DELETE"
    });

    alert("Order deleted successfully!");
    await loadOrders();

  } catch (error) {
    alert(error.message);
  }
}

document.getElementById("password").addEventListener(
  "keydown",
  event => {
    if (event.key === "Enter") login();
  }
);
</script>

</body>
</html>
